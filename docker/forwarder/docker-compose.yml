# =============================================================================
# Forwarder Service for PyFM
# =============================================================================
#
# Runtime configuration comes from .env (same directory as this file).
# Do not duplicate .env variables under environment: below.
#
# To switch between legacy and v2 routing, edit .env:
#   FORWARDER_CONFIG=/app/conf/forwarder_targets.json   # legacy
#   FORWARDER_CONFIG=/app/conf/forwarder_routes.json    # v2
#
# Usage:
#   docker compose up -d           # Start forwarder
#   docker compose logs -f         # View logs
#   docker compose down            # Stop forwarder
#   docker compose up -d --build   # Rebuild and start
#
# =============================================================================

services:
  forwarder:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.forwarder

    image: pyfm-forwarder:latest
    container_name: pyfm_forwarder

    env_file:
      - .env

    environment:
      # Container-structural paths only — not present in .env
      FORWARDER_LOG_FILE: /app/logs/forwarder.log
      FORWARDER_CONNS: /app/conf/private/conns.json

    volumes:
      - ./logs:/app/logs
      - ../../conf:/app/conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - pyfm_network

    restart: unless-stopped

networks:
  pyfm_network:
    external: true
    name: pyfm_network
